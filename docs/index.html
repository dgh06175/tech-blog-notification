<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>기술 블로그 모음</title>
  <meta name="description" content="여러 기술 블로그의 최신 글을 한곳에서 확인하세요." />
  <link rel="icon" href="res/favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav-bar">
    <h1 class="nav-title">기술 블로그 모음</h1>
    <button id="bookmark-filter" class="bookmark-filter" type="button"
            aria-pressed="false" aria-label="북마크만 보기">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M6 3a2 2 0 0 0-2 2v16l8-5 8 5V5a2 2 0 0 0-2-2H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main id="content">
    <div id="sections"></div>

    <p id="empty-state" class="empty-state" hidden>게시글이 없습니다.</p>
    <p id="error-state" class="error-state" hidden>게시글을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>

    <div id="loading" class="loading-state">
      <span class="spinner" aria-hidden="true"></span>
      <span>게시글 로딩중..</span>
    </div>

    <div id="scroll-sentinel" aria-hidden="true"></div>
    <button id="load-more" class="load-more" type="button" hidden>더 보기</button>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
